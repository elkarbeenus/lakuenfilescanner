[package]
name = "lakuenfilescanner"
version = "0.1.0"
description = "LakuenFileScanner – fast malware scanner for SteamOS / Linux"
authors = ["Dominic Lesina", "Claude"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
crossbeam-channel = "0.5"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
libc = "0.2"
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
