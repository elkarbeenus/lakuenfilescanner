<!DOCTYPE html>
<html lang="de" data-theme="midnight">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LakuenFileScanner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside>
      <div class="brand">
        <img src="logo.svg" alt="" />
        <div><b>LakuenFileScanner</b><span>Malware Scanner</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div class="pill" id="enginePill"><span class="dot"></span><span>…</span></div>
        <div class="ver"><span id="verLabel"></span><br /><span data-i18n="credits"></span></div>
      </div>
    </aside>
    <main id="main">
      <div id="banner"></div>
      <div id="view"></div>
    </main>
  </div>
  <div class="dropzone-overlay" id="dropOverlay"><div style="text-align:center"><svg class="i"><use href="#i-download"/></svg><span data-i18n="drop_overlay"></span></div></div>
  <div id="modal"></div>
  <div id="toasts"></div>

</html>
